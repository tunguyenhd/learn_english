name: Auto Crawl & Update Vocabulary

on:
  schedule:
    - cron: '0 0 * * 0' # Tự động chạy vào 0h Chủ Nhật hàng tuần
  workflow_dispatch:      # Nút bấm thủ công "Run workflow" trên giao diện GitHub Actions

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Vocabulary Crawler
        run: node scripts/crawler.js

      - name: Commit and Push if updated
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/vocabulary.json public/data/vocabulary.json
          if git diff --staged --quiet; then
            echo "No new vocabulary data to commit."
          else
            git commit -m "chore(data): auto-update vocabulary dataset [skip ci]"
            git push
          fi
